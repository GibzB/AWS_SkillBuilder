[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-builder-automation"
version = "0.1.0"
description = "AWS Builder Learning Automation Engine: generates, validates, publishes, and notifies one first-person Builder Center article per campaign day."
readme = "prd.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "AWS Builder" }]

dependencies = [
    "boto3>=1.34",
    "markdown-it-py>=3.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100",
    "pytest>=8.0",
    "mypy>=1.10",
    "boto3-stubs[dynamodb,bedrock-runtime,sns,secretsmanager]>=1.34",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.prompts" = ["*.md"]

# ---------------------------------------------------------------------------
# pytest configuration
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "unit: fast example and edge-case tests",
    "property: Hypothesis property-based tests (min 100 iterations)",
    "integration: tests against emulated or test-region AWS services",
]

# ---------------------------------------------------------------------------
# mypy configuration (strict-ish typing)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["app", "tests"]
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
check_untyped_defs = true
show_error_codes = true
pretty = true

